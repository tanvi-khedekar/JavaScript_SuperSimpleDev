<!DOCTYPE html>
<html>

<head>
  <title>Rock Paper Scissors</title>
</head>

<body>
  <p>Rock Paper Scissors</p>

  <!-- ALGORITHM
    STEPS:
      1. Computer randomly selects a move 
      2. Compare the moves to get the result
      3. Display the result in a popup
  -->

  <button onclick="
    playGame('rock');
  ">Rock</button>

  <button onclick="
    playGame('paper');
  ">Paper</button>

  <button onclick="
    playGame('scissors');
  ">Scissors</button>

  <button onclick="
    score.wins = 0;
    score.losses = 0;
    score.ties = 0;
  ">Reset Score</button>

  <script>  //the code in the script element runs when the page is loaded.

    const score = {               // we could create separare variables, but we're creating an object for convenience
      wins: 0,
      losses: 0,
      ties: 0
    };                              //we've created this object OUTSIDE the function, in order to save the score from last time. if it was inside the function, the fuction would create a new score every time; which is not what we want.

    function playGame(playerMove) {
      const computerMove = pickComputerMove();
      
      let result = '';

      if(playerMove === 'scissors') {
        if (computerMove === 'rock') {
          result = 'You lose.';
        } else if (computerMove === 'paper') {
          result = 'You win.'
        } else if (computerMove === 'scissors') {
          result = 'Tie.';
        } 

      } else if (playerMove === 'paper') {
          if (computerMove === 'rock') {
            result = 'You win.';
          } else if (computerMove === 'paper') {
            result = 'Tie.'
          } else if (computerMove === 'scissors') {
            result = 'You lose.';
          }
          
      } else if (playerMove === 'rock') {
          if (computerMove === 'rock') {
            result = 'Tie.';
          } else if (computerMove === 'paper') {
            result = 'You lose.'
          } else if (computerMove === 'scissors') {
            result = 'You win.';
          }
      }

      if (result === 'You win.'){
        score.wins += 1;
      } else if (result === 'You lose.') {
        score.losses += 1;
      } else if (result === 'Tie.') {
        score.ties += 1;
      }

      alert(`You picked ${playerMove}. Computer picked ${computerMove}. ${result}
Wins: ${score.wins}, Losses: ${score.losses}, Ties: ${score.ties}`);
    }

    function pickComputerMove() {
      const randomNumber = Math.random(); // 0 <= number < 1

      let computerMove = '';      // this is a LOCAL VARIABLE, if it were out of the function block it wouldve been a GLOBAL VARIABLE

      if (randomNumber >= 0 && randomNumber < 1/3 ) {
        computerMove = 'rock';
      } else if (randomNumber >= 1/3 && randomNumber < 2/3) {
        computerMove = 'paper';
      } else if (randomNumber >= 2/3 && randomNumber < 1) {
        computerMove = 'scissors';
        // var randomNumber = 0.5     //var doesnt follow rules of scope, this one will conflict with the one created above
      }

      // RETURN - gives a value out of a function
      return computerMove;    //returning a variable is preferred over a global variable; here, the scope can help us prevent naming conflicts.
      //console.log('after');     //this wont run because after 'return' the code returns back to where the function was called
    }
  </script>
</body>

</html>
