<!DOCTYPE html>
<html>

<head>
  <title>Objects</title>    <!-- an object groups multiple values together-->
</head>

<body>
  <script>
    const product = {
      name: 'socks',        <!--name is the property, in front of it is the value associated with it-->
      price: 1090           <!-- propert-value pair -->
    };
    console.log(product);
    console.log(product.name);      <!--accessing value using the property-->
    console.log(product.price);         <!--dot notation-->
    
    product.name = 'cotton socks';      <!--value associated with name was changed to cotton socks-->
    console.log(product);

    product.newProperty = true;         <!--adding new values-->
    console.log(product);

    delete product.newProperty;       <!--deleting a property-value pair-->
    console.log(product);

    <!--  WHY DO WE USE OBJECTS?  -->
    <!--they make our code organized, they allow us to group values together, they allow us to use values together -->

  </script>
</body>

</html>
