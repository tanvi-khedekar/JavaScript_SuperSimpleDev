    // TERNARY OPERATOR (?:) : similar to if-else statement
    const result = 1 ? 'truthy' : 'falsy';
    console.log(result);            // truthy, wouldve been falsy if result = 0(falsy value) LOLLLLLLLLL

    /*above is a shortcut to below code
      if (true) {

    */

    //GUARD operator (&&)
    false && console.log('hello');    //this does not run the code on the right, i.e. hello is not printed on the console as the left side is 'falsy' so the && operator stops early or short circuits
    //thus we can use the value on the left to block or guard the code on the right.

    /*above is shortcut for code like below
