<!DOCTYPE html>
<html>

<head>
  <title>Booleans</title>
</head>

<body>
  <script>
    console.log(typeof 'true'); // not used in quotes or considered as STRING
    console.log(typeof true); //BOOLEAN
    false

    console.log(3 < 5); // o/p: true
    console.log(3 > 5); // o/p: false

    console.log(5 === '5.00'); //true as it converts both values to be equal
    console.log(5 === 5); //preffered === because its safer

    if (false) {
      console.log('hello')
    } else {
      console.log('else');
    }

    //code to check if someone if eligible to drive

    const age = 15;

    if (age >= 16) {
      console.log('You can drive.');
      console.log('Congrats.');
    } else if (age >= 14) {
      console.log('Almost there!');
    } else {
      console.log('You can not drive.');
    }

  </script>
</body>

</html>
