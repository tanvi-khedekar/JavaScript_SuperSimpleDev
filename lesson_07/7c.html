<!DOCTYPE html>
<html>
  <head></head>
  <body>
    <script>
      greet('Tanvi');
      greet();

      function greet (name) {
        if (!name) {
          console.log('Hello there!');
        } else {
          console.log(`Hello ${name}!`);
        } 
      }

      greet('Gauri');
    </script>
  </body>
</html>
