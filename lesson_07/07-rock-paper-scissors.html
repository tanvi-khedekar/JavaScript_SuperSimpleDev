<!DOCTYPE html>
<html>

<head>
  <title>Rock Paper Scissors</title>
</head>

<body>
  <p>Rock Paper Scissors</p>

  <!-- ALGORITHM
    STEPS:
      1. Computer randomly selects a move 
      2. Compare the moves to get the result
      3. Display the result in a popup
  -->

  <button onclick="
    const computerMove = pickComputerMove();

    let result = '';

    if (computerMove === 'rock') {
      result = 'Tie.';
    } else if (computerMove === 'paper') {
      result = 'You lose.'
    } else if (computerMove === 'scissors') {
      result = 'You win.';
    }

    alert(`You picked rock. Computer picked ${computerMove}. ${result}`);
  ">Rock</button>

  <button onclick="
    const computerMove = pickComputerMove();

    let result = '';

    if (computerMove === 'rock') {
      result = 'You win.';
    } else if (computerMove === 'paper') {
      result = 'Tie.'
    } else if (computerMove === 'scissors') {
      result = 'You lose.';
    }

    alert(`You picked paper. Computer picked ${computerMove}. ${result}`);    
  ">Paper</button>

  <button onclick="

    const computerMove = pickComputerMove();
    
    let result = '';

    if (computerMove === 'rock') {
      result = 'You lose.';
    } else if (computerMove === 'paper') {
      result = 'You win.'
    } else if (computerMove === 'scissors') {
      result = 'Tie.';
    }

    alert(`You picked scissors. Computer picked ${computerMove}. ${result}`);
  ">Scissors</button>

  <script>  //the code in the script element runs when the page is loaded.

    function pickComputerMove() {
      const randomNumber = Math.random(); // 0 <= number < 1

      let computerMove = '';      // LOCAL VARIABLE, if it were out of the function block it wouldve been a GLOBAL VARIABLE

      if (randomNumber >= 0 && randomNumber < 1/3 ) {
        computerMove = 'rock';
      } else if (randomNumber >= 1/3 && randomNumber < 2/3) {
        computerMove = 'paper';
      } else if (randomNumber >= 2/3 && randomNumber < 1) {
        computerMove = 'scissors';
        // var randomNumber = 0.5     //var doesnt follow rules of scope, this one will conflict with the one created above
      }

      // RETURN - gives a value out of a function
      return computerMove;    //returning a variable is preferred over a global variable; here, the scope can help us prevent naming conflicts.
      //console.log('after');     //this wont run because after 'return' the code returns back to where the function was called
    }
  </script>
</body>

</html>
