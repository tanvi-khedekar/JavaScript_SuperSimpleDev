<!DOCTYPE html>
<html>
  <head>
    <title>
      Calculator
    </title>
  </head>
  <body>
    
    <p>
    <button onclick="
      calculation += '1';
      console.log(calculation);
    ">1</button>
  
    <button onclick="
      calculation += '2';
      console.log(calculation);
    ">2</button>

    <button onclick="
      calculation += '3';
      console.log(calculation);
    ">3</button>

    <button onclick="
      calculation += ' + ';
      console.log(calculation);
    ">+</button>

    <button onclick="
      //dont use eval() in real world p
      calculation = eval(calculation);
      console.log(calculation);
    ">=</button>
    </p>
    <script>
      let calculation ='';
    </script>
  </body>
</html>
